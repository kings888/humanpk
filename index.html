<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>CSV数据可视化</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .button-container {
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .title-section {
            text-align: center;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-text {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo {
            height: 40px;
            margin: 0;
            background-color: white;
            padding: 2px;
            border-radius: 4px;
        }
        .main-title {
            margin: 0;
            font-size: 24px;
            color: #333;
        }
        .sub-title {
            margin: 5px 0 0 0;
            font-size: 16px;
            color: #666;
        }
        .buttons-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .csv-button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .csv-button:hover {
            background-color: #45a049;
        }
        #tableContainer {
            margin: 20px;
            overflow-x: auto;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        #chartContainer {
            margin: 20px;
            max-width: 800px;
        }
        .cell-position {
            color: #bbb;
            font-size: 0.7em;
            position: absolute;
            top: 1px;
            right: 2px;
            opacity: 0.6;
            font-weight: 300;
            pointer-events: none;
        }
        td {
            position: relative;
            padding: 16px 8px 8px 8px !important;
        }
        input {
            width: 100% !important;
            box-sizing: border-box;
            padding: 2px 4px;
        }
        .row-header {
            color: #bbb;
            font-size: 0.7em;
            text-align: center;
            font-weight: 300;
        }
        .constant-cell {
            background-color: #f0f0f0;
        }
        .input-cell {
            background-color: #fff;
        }
        .output-cell {
            background-color: #fff;
        }
        .cell-container {
            position: relative;
        }
        .cell-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            padding: 2px 4px;
        }
        .cell-content {
            position: relative;
        }
        .error-value {
            color: red;
        }
        .readonly {
            background-color: #f0f0f0;
            cursor: not-allowed;
        }
        .editable {
            background-color: white;
            cursor: text;
        }
        .data-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
        }
        .data-table td {
            border: 1px solid #ddd;
            padding: 8px;
            min-width: 100px;  /* 设置最小列宽 */
            position: relative;
        }
        .data-table .header-row td {
            background-color: #4CAF50;  /* 绿色背景 */
            color: white;  /* 白色字体 */
            font-weight: bold;
        }
        .data-table .cell-input {
            width: 90%;  /* 输入框宽度 */
            padding: 4px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="button-container">
        <div class="header-container">
            <div class="title-section">
                <div class="title-text">
                    <img src="logo.png" alt="Company Logo" class="logo">
                    <div>
                        <h1 class="main-title">Human PK Analysis</h1>
                        <p class="sub-title">Pharmacokinetic Data Analysis Tool</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="buttons-row">
            <button class="csv-button" onclick="loadCSV('Allometry-CL.csv')">Allometry-CL</button>
            <button class="csv-button" onclick="loadCSV('CL and Vss in preclinical.csv')">CL and Vss in preclinical</button>
            <button class="csv-button" onclick="loadCSV('FCIM.csv')">FCIM</button>
            <button class="csv-button" onclick="loadCSV('IVIVE for CL.csv')">IVIVE for CL</button>
            <button class="csv-button" onclick="loadCSV('Wajim-CL.csv')">Wajim-CL</button>
        </div>
    </div>
    <div id="tableContainer"></div>
    <div id="chartContainer">
        <canvas id="myChart"></canvas>
    </div>

    <script>
        let currentChart = null;
        let currentFCIMData = null;
        let currentCLVssData = null;
        let currentAllometryData = null;
        let currentWajimData = null;
        let currentIVIVEData = null; // 添加IVIVE数据的存储变量

        // 添加IVIVE表格的列标题定义
        const iviveHeaders = [
            'Compound ID', 'clogP', 'Species', 'T1/2 (min)', 'CLint', 'fu, inc', 'CLint,u', 'T1/2 (min)', 
            'CLint', 'fu, inc', 'CLint,u', 'fu, p', 'MPPGL (mg/g)', 'HPGL (million/g)', 'Qh (mL/min/kg)', 
            'Liver (g/kg)', 'CLh pred. Clint', 'CLh pred. Clint, u', 'CLh pred. Clint', 'CLh pred. Clint, u', 
            'CL,obs (mL/min/kg)', 'CL,obs (mL/min/kg)'
        ];

        // 修改 loadCSV 函数
        function loadCSV(filename) {
            console.log('尝试加载文件:', filename);
            
            // 使用 Promise 包装异步操作
            return new Promise((resolve, reject) => {
                fetch(filename)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(csvData => {
                        let config = {
                            download: false,
                            dynamicTyping: true,
                            skipEmptyLines: false,
                            error: function(error) {
                                console.error('加载错误:', error);
                                reject(error);
                            },
                            complete: function(results) {
                                try {
                                    if (filename === 'FCIM.csv') {
                                        currentFCIMData = processFCIMData(results.data);
                                        displayFCIMData(currentFCIMData, filename);
                                    } else if (filename === 'Wajim-CL.csv') {
                                        currentWajimData = processWajimData(results.data);
                                        displayWajimData(currentWajimData, filename);
                                    } else if (filename === 'Allometry-CL.csv') {
                                        currentAllometryData = processAllometryData(results.data);
                                        restoreAllometryData();
                                        updateAllometryDisplay();
                                    } else if (filename === 'IVIVE for CL.csv') {
                                        currentIVIVEData = results.data;
                                        restoreIVIVEData();
                                        displayIVIVEData(currentIVIVEData, filename);
                                    } else if (filename === 'CL and Vss in preclinical.csv') {
                                        currentCLVssData = results.data;
                                        restorePreclinicalData();
                                        displayData(currentCLVssData, filename);
                                    }
                                    resolve(results);
                                } catch (error) {
                                    console.error('处理数据时发生错误:', error);
                                    reject(error);
                                }
                            }
                        };

                        // 解析CSV数据
                        Papa.parse(csvData, config);
                    })
                    .catch(error => {
                        console.error('加载文件错误:', error);
                        reject(error);
                    });
            });
        }

        function getColumnLabel(index) {
            // 将列索引转换为字母标识（A=0, B=1, etc.）
            let label = '';
            while (index >= 0) {
                label = String.fromCharCode(65 + (index % 26)) + label;
                index = Math.floor(index / 26) - 1;
            }
            return label;
        }

        // 添加专门用于显示IVIVE数据的函数
        function displayIVIVEData(rawData, filename) {
            if (!rawData || rawData.length === 0) return;
            
            let table = '<table class="data-table"><tbody>';
            
            // 遍历原始数据行，但跳过A24和A25行
            for (let i = 0; i < rawData.length; i++) {
                // 跳过input data和output data行
                if (i === 23 || i === 24) continue;
                
                const row = rawData[i];
                
                // 跳过完全空的行
                if (row.every(cell => !cell)) {
                    table += '<tr><td class="cell-container">';
                    table += `<div class="cell-position">A${i+2}</div>`;
                    table += '</td></tr>';
                    continue;
                }
                
                // 检查是否是需要特殊样式的行（A2, A3, A11, A12）
                const isSpecialRow = (i === 0 || i === 1 || i === 9 || i === 10);
                
                table += isSpecialRow ? 
                    '<tr style="background-color: #4CAF50; color: white;">' : 
                    '<tr>';
                
                // 处理每一行的单元格
                for (let j = 0; j < row.length; j++) {
                    // 如果是第一行（i=0）或第十行（i=9）且是D到G列（j=3到6），合并单元格显示Mxsomes
                    if ((i === 0 || i === 9) && j >= 3 && j <= 6) {
                        if (j === 3) {
                            // 只在D列显示合并的单元格
                            table += `<td class="cell-container" colspan="4" style="text-align: center;">
                                <div class="cell-position" style="color: ${isSpecialRow ? 'rgba(255,255,255,0.7)' : '#999'}">${getColumnLabel(j)}${i+2}</div>
                                <div class="cell-content">Mxsomes</div>
                            </td>`;
                        }
                        continue; // 跳过E、F、G列
                    }

                    // 如果是第一行（i=0）或第十行（i=9）且是H到K列（j=7到10），合并单元格显示Hep
                    if ((i === 0 || i === 9) && j >= 7 && j <= 10) {
                        if (j === 7) {
                            // 只在H列显示合并的单元格
                            table += `<td class="cell-container" colspan="4" style="text-align: center;">
                                <div class="cell-position" style="color: ${isSpecialRow ? 'rgba(255,255,255,0.7)' : '#999'}">${getColumnLabel(j)}${i+2}</div>
                                <div class="cell-content">Hep</div>
                            </td>`;
                        }
                        continue; // 跳过I、J、K列
                    }

                    let cellContent = row[j] || '';
                    const cellPosition = `${getColumnLabel(j)}${i+2}`;
                    
                    // 如果是A3或A12行，设置列标题
                    if ((i === 1 || i === 10) && j < iviveHeaders.length) {
                        cellContent = iviveHeaders[j];
                    }
                    
                    // 检查是否是可编辑列（B=1, D=3, E=4, H=7, I=8, L=11）
                    const editableColumns = [1, 3, 4, 7, 8, 11];
                    if (editableColumns.includes(j) && i > 0 && i !== 8 && i !== 9 && i !== 1 && i !== 10) {
                        // 从SessionStorage获取保存的值
                        const storageKey = `ivive_${i}_${j}`;
                        const savedValue = sessionStorage.getItem(storageKey);
                        
                        // 使用保存的值或原始值
                        const displayValue = savedValue !== null ? savedValue : cellContent;
                        
                        // 创建可编辑的输入框
                        table += `<td class="cell-container">
                                <div class="cell-position" style="color: ${isSpecialRow ? 'rgba(255,255,255,0.7)' : '#999'}">${cellPosition}</div>
                                <input type="number" 
                                class="cell-input"
                                value="${displayValue}" 
                                step="0.00000001"
                                data-row="${i}"
                                data-col="${j}"
                                onchange="updateIVIVEValue(this.value, ${i}, ${j})"
                                />
                            </td>`;
                    } else {
                        // 其他列保持原样显示
                        table += '<td class="cell-container">';
                        table += `<div class="cell-position" style="color: ${isSpecialRow ? 'rgba(255,255,255,0.7)' : '#999'}">${cellPosition}</div>`;
                        
                        // 格式化数字
                        if (!isNaN(parseFloat(cellContent)) && isFinite(cellContent)) {
                            const num = parseFloat(cellContent);
                            if (num % 1 !== 0) {
                                cellContent = num.toFixed(6);
                            }
                        }
                        
                        // 处理特殊值
                        if (cellContent === "#DIV/0!" || cellContent === "#REF!" || cellContent === "#VALUE!") {
                            cellContent = `<span class="error-value">${cellContent}</span>`;
                        }
                        
                        table += `<div class="cell-content">${cellContent}</div>`;
                    }
                    
                    table += '</td>';
                }
                
                table += '</tr>';
            }

            table += '</tbody></table>';
            document.getElementById('tableContainer').innerHTML = table;
        }

        function displayData(data, filename) {
            try {
                if (!data || !Array.isArray(data)) {
                    console.error('无效的数据格式');
                    return;
                }
                
                // 确保数据至少有3行（空行、标题行和数据行）
                if (data.length < 3) {
                    console.error('数据行数不足');
                    return;
                }
                
                // 创建表格HTML
                let table = '<div style="margin-bottom: 20px;">';
                table += '<table class="data-table">';
                
                // 添加标题行
                table += '<thead><tr style="background-color: #4CAF50; color: white;">';
                const headers = ['Animal', 'Dose (mg/kg)', 'BW(kg)', 'CL/F(mL/min/kg)', 'CL(mL/min)', 
                                'CL(L/h)', 'Vd/F (L/kg)', 'Vss (L)', 'fu', 'CL/fu', 'Vss/fu'];
                headers.forEach((header, colIndex) => {
                    const cellPosition = `${getColumnLabel(colIndex)}1`;
                    table += `<td class="cell-container">
                        <div class="cell-position" style="color: rgba(255,255,255,0.7);">${cellPosition}</div>
                        <div class="cell-content">${header}</div>
                    </td>`;
                });
                table += '</tr></thead><tbody>';
                
                // 处理数据行，跳过第一行（空行）和第二行（标题行）
                for (let i = 2; i < data.length; i++) {
                    const row = data[i];
                    if (!row || !Array.isArray(row) || row.every(cell => !cell)) continue; // 跳过空行
                    
                    table += '<tr>';
                    headers.forEach((header, colIndex) => {
                        let cellContent = row[colIndex] || '';
                        const cellPosition = `${getColumnLabel(colIndex)}${i+1}`;
                        
                        // 检查是否是可编辑列 (B, C, D, E, F, G, H, I列)
                        if ([1, 2, 3, 4, 5, 6, 7, 8].includes(colIndex)) {
                            // 从SessionStorage获取保存的值
                            const storageKey = `preclinical_${i}_${colIndex}`;
                            const savedValue = sessionStorage.getItem(storageKey);
                            
                            table += `<td class="cell-container">
                                <div class="cell-position">${cellPosition}</div>
                                <input type="number" 
                                    value="${savedValue || ''}" 
                                    step="0.00000001"
                                    style="width: 120px;"
                                    data-row="${i}"
                                    data-col="${colIndex}"
                                    onchange="updateCLVssValue(this.value, ${i}, ${colIndex})"
                                />
                            </td>`;
                        } else {
                            // 不可编辑列保持原样显示
                            table += `<td class="cell-container">
                                <div class="cell-position">${cellPosition}</div>
                                <div class="cell-content">${cellContent}</div>
                            </td>`;
                        }
                    });
                    table += '</tr>';
                }
                table += '</tbody></table>';
                table += '</div>';
                
                const tableContainer = document.getElementById('tableContainer');
                if (!tableContainer) {
                    console.error('找不到tableContainer元素');
                    return;
                }
                tableContainer.innerHTML = table;

                // 更新图表
                if (typeof updateChart === 'function') {
                    updateChart(data, filename);
                }
            } catch (error) {
                console.error('显示数据时发生错误:', error);
                alert('显示数据时发生错误，请检查控制台获取详细信息');
            }
        }

        function updateChart(data, filename) {
            if (currentChart) {
                currentChart.destroy();
            }

            const ctx = document.getElementById('myChart').getContext('2d');
            const headers = Object.keys(data[0]);
            
            // 根据文件名选择合适的图表配置
            const chartConfig = getChartConfig(filename, data, headers);
            currentChart = new Chart(ctx, chartConfig);
        }

        function getChartConfig(filename, data, headers) {
            if (filename === 'Allometry-CL.csv') {
                // 找到包含有效数据的列
                const validHeaders = headers.filter(header => 
                    data.some(row => row[header] !== null && !isNaN(row[header]))
                );

                // 找到可能的x轴数据（通常是体重或其他度量）
                const xHeader = validHeaders.find(h => 
                    h.toLowerCase().includes('weight') || 
                    h.toLowerCase().includes('bw') ||
                    h.toLowerCase().includes('brain')
                ) || validHeaders[0];

                // 创建数据集
                const datasets = validHeaders
                    .filter(header => header !== xHeader)
                    .map(header => ({
                        label: header,
                        data: data
                            .filter(row => 
                                row[xHeader] !== null && 
                                row[header] !== null && 
                                !isNaN(row[xHeader]) && 
                                !isNaN(row[header])
                            )
                            .map(row => ({
                                x: row[xHeader],
                                y: row[header]
                            })),
                        backgroundColor: getRandomColor()
                    }))
                    .filter(dataset => dataset.data.length > 0);

                return {
                    type: 'scatter',
                    data: { datasets },
                    options: {
                        responsive: true,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Allometry Analysis',
                                font: { size: 16 }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return `${context.dataset.label}: (${context.parsed.x}, ${context.parsed.y})`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                type: 'linear',
                                position: 'bottom',
                                title: {
                                    display: true,
                                    text: xHeader
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: 'Values'
                                }
                            }
                        }
                    }
                };
            }
            
            // 根据不同的文件选择不同的图表配置
            if (filename === 'CL and Vss in preclinical.csv') {
                return {
                    type: 'bar',
                    data: {
                        labels: data.map(row => row['Compound']),  // 使用 Compound 作为标签
                        datasets: [
                            {
                                label: 'CL(L/h)',
                                data: data.map(row => row['CL(L/h)']),
                                backgroundColor: 'rgba(75, 192, 192, 0.5)'
                            },
                            {
                                label: 'Vss (L)',
                                data: data.map(row => row['Vss (L)']),
                                backgroundColor: 'rgba(255, 99, 132, 0.5)'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            title: {
                                display: true,
                                text: 'CL and Vss in Preclinical',
                                font: { size: 16 }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: { 
                                    display: true,
                                    text: 'Value'
                                }
                            },
                            x: {
                                ticks: {
                                    maxRotation: 45,
                                    minRotation: 45
                                }
                            }
                        }
                    }
                };
            }
            
            // 修改FCIM的图表配置
            if (filename === 'FCIM.csv') {
                return {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: 'Log CL vs Log BW',
                            data: data
                                .filter(row => 
                                    row['Log BW'] !== null && 
                                    row['Log CL'] !== null && 
                                    !isNaN(row['Log BW']) && 
                                    !isNaN(row['Log CL'])
                                )
                                .map(row => ({
                                    x: row['Log BW'],
                                    y: row['Log CL']
                                })),
                            backgroundColor: 'rgba(75, 192, 192, 0.5)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            pointRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            title: {
                                display: true,
                                text: 'FCIM Analysis - Log CL vs Log BW',
                                font: { size: 16 }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return `(${context.parsed.x.toFixed(8)}, ${context.parsed.y.toFixed(8)})`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'Log BW'
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: 'Log CL'
                                }
                            }
                        }
                    }
                };
            }
            
            if (filename === 'IVIVE for CL.csv') {
                // 创建一个多系列的散点图，比较不同物种的数据
                const datasets = [];
                
                // 按Species分组
                const speciesGroups = {};
                data.forEach(row => {
                    if (row['Species'] && row['CLint'] && row['fu, inc']) {
                        const species = row['Species'];
                        if (!speciesGroups[species]) {
                            speciesGroups[species] = [];
                        }
                        speciesGroups[species].push(row);
                    }
                });
                
                // 为每个物种创建一个数据集
                const colors = {
                    'h': 'rgba(75, 192, 192, 0.8)',   // 人 - 蓝绿色
                    'm': 'rgba(255, 99, 132, 0.8)',   // 鼠 - 红色
                    'r': 'rgba(255, 206, 86, 0.8)',   // 大鼠 - 黄色
                    'd': 'rgba(54, 162, 235, 0.8)',   // 狗 - 蓝色
                    'c': 'rgba(153, 102, 255, 0.8)'   // 猴 - 紫色
                };
                
                const speciesLabels = {
                    'h': 'Human',
                    'm': 'Mouse',
                    'r': 'Rat',
                    'd': 'Dog',
                    'c': 'Monkey'
                };
                
                // 如果没有按物种分组成功，创建单一数据集
                if (Object.keys(speciesGroups).length === 0) {
                return {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: 'CLint vs fu',
                            data: data
                                .filter(row => 
                                    row['CLint'] !== null && 
                                    row['fu, inc'] !== null &&
                                    !isNaN(row['CLint']) && 
                                    !isNaN(row['fu, inc'])
                                )
                                .map(row => ({
                                    x: row['fu, inc'],
                                    y: row['CLint']
                                })),
                            backgroundColor: 'rgba(75, 192, 192, 0.5)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            pointRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            title: {
                                display: true,
                                text: 'IVIVE Analysis',
                                font: { size: 16 }
                                }
                            },
                            scales: {
                                x: {
                                    title: {
                                        display: true,
                                        text: 'fu, inc'
                                    }
                                },
                                y: {
                                    title: {
                                        display: true,
                                        text: 'CLint'
                                    }
                                }
                            }
                        }
                    };
                }
                
                // 为每个物种创建数据集
                Object.entries(speciesGroups).forEach(([species, rows]) => {
                    const speciesLabel = speciesLabels[species] || species;
                    
                    // 创建数据集
                    datasets.push({

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';

            return color;
        }

        // 添加更新CL值的函数
        function updateCLValue(rowIndex, newValue) {
            if (!currentFCIMData) return;

            // 更新数据
            currentFCIMData[rowIndex]['CL (mL/min)'] = parseFloat(newValue);
            
            // 计算新的Log CL值
            if (!isNaN(newValue) && newValue > 0) {
                currentFCIMData[rowIndex]['Log CL'] = Math.log10(parseFloat(newValue));
                
                // Update fixedCLValues for C21 and C22
                const actualRowNumber = rowIndex + 15;  // Convert to actual row number
                if (actualRowNumber === 21) {  // C21
                    fixedCLValues[5] = parseFloat(newValue);  // Update C21 value
                    // Recalculate C23 = C21/C22
                    if (fixedCLValues[6] !== undefined) {  // If C22 exists
                        fixedCLValues[7] = fixedCLValues[5] / fixedCLValues[6];
                    }
                } else if (actualRowNumber === 22) {  // C22
                    fixedCLValues[6] = parseFloat(newValue);  // Update C22 value
                    // Recalculate C23 = C21/C22
                    if (fixedCLValues[5] !== undefined) {  // If C21 exists
                        fixedCLValues[7] = fixedCLValues[5] / fixedCLValues[6];
                    }
                }
            } else {
                currentFCIMData[rowIndex]['Log CL'] = null;
            }

            // 更新显示
            displayData(currentFCIMData, 'FCIM.csv');
        }

        // 修改 updateCLVssValue 函数，添加计算逻辑
        function updateCLVssValue(newValue, rowIndex, colIndex) {
            try {
                const storageKey = `preclinical_${rowIndex}_${colIndex}`;
                
                // 处理空值情况
                if (newValue === '' || newValue === null) {
                    sessionStorage.removeItem(storageKey);
                    if (currentCLVssData && currentCLVssData[rowIndex]) {
                        currentCLVssData[rowIndex][colIndex] = '';
                    }
                } else {
                    // 处理数值情况
                    const numValue = parseFloat(newValue);
                    if (!isNaN(numValue)) {
                        sessionStorage.setItem(storageKey, numValue.toString());
                        if (currentCLVssData && currentCLVssData[rowIndex]) {
                            currentCLVssData[rowIndex][colIndex] = numValue;
                        }
                    }
                }

                // 如果更新的是C列(BW)或D列(CL/F)，重新计算E和F列
                if ((colIndex === 2 || colIndex === 3) && currentCLVssData && currentCLVssData[rowIndex]) {
                    const bw = parseFloat(currentCLVssData[rowIndex][2]); // C列 - BW(kg)
                    const clF = parseFloat(currentCLVssData[rowIndex][3]); // D列 - CL/F(mL/min/kg)
                    
                    // 只有当两个值都存在且有效时才计算
                    if (!isNaN(bw) && !isNaN(clF)) {
                        // 计算E列 - CL(mL/min)
                        const clMlMin = clF * bw;
                        currentCLVssData[rowIndex][4] = clMlMin;
                        sessionStorage.setItem(`preclinical_${rowIndex}_4`, clMlMin.toString());
                        
                        // 计算F列 - CL(L/h)
                        const clLHr = clMlMin * 0.06;
                        currentCLVssData[rowIndex][5] = clLHr;
                        sessionStorage.setItem(`preclinical_${rowIndex}_5`, clLHr.toString());
                    } else {
                        // 如果输入值无效，清除计算结果
                        sessionStorage.removeItem(`preclinical_${rowIndex}_4`);
                        sessionStorage.removeItem(`preclinical_${rowIndex}_5`);
                        if (currentCLVssData[rowIndex]) {
                            currentCLVssData[rowIndex][4] = '';
                            currentCLVssData[rowIndex][5] = '';
                        }
                    }
                }

                // 重新显示数据
                displayData(currentCLVssData, 'CL and Vss in preclinical.csv');
            } catch (error) {
                console.error('更新数据时发生错误:', error);
            }
        }

        function restorePreclinicalData() {
            if (!currentCLVssData) return;
            
            try {
                // 遍历所有行
                for (let i = 2; i < currentCLVssData.length; i++) {

                    // 恢复所有可编辑列的值

                        if (savedValue !== null) {

        // 修改 updateAllometryValue 函数
        function updateAllometryValue(header, rowIndex, newValue) {
            if (!currentAllometryData || !currentAllometryData.mainData) return;
            
            try {
                const value = parseFloat(newValue);
                if (isNaN(value)) return;

                // 保存更新的值到SessionStorage
                const columnMap = {
                    'Body Weight (kg)': 'columnB',
                    'Cl(L/h)': 'columnE',
                    'Fu': 'columnG'
                };
                const storageKey = columnMap[header];
                if (storageKey) {
                    const currentValues = JSON.parse(sessionStorage.getItem(storageKey) || '[]');
                    while (currentValues.length <= rowIndex) {
                        currentValues.push(0);
                    }
                    currentValues[rowIndex] = value;
                    sessionStorage.setItem(storageKey, JSON.stringify(currentValues));
                }

                // 更新数据结构中的值
                currentAllometryData.mainData[rowIndex][header] = value;

                // 更新当前行的所有计算值
                const row = currentAllometryData.mainData[rowIndex];
                
                // 1. 计算 Brain Weight
                if (header === 'Body Weight (kg)') {
                    const bw = value;
                    switch(row['Animal']) {
                        case 'Mouse':
                            row['Brain Weight (kg)'] = bw * 1.65/100;
                            break;
                        case 'Rat':
                            row['Brain Weight (kg)'] = bw * 0.57/100;
                            break;
                        case 'Dog':
                            row['Brain Weight (kg)'] = bw * 0.78/100;
                            break;
                        case 'Monkey':
                            row['Brain Weight (kg)'] = bw * 1.56/100;
                            break;
                        case 'Human':
                            row['Brain Weight (kg)'] = bw * 2/100;
                            break;
                    }
                }

                // 2. 计算 MLP
                const bw = parseFloat(row['Body Weight (kg)']);
                const brainWeight = parseFloat(row['Brain Weight (kg)']);
                if (!isNaN(bw) && !isNaN(brainWeight) && bw > 0 && brainWeight > 0) {
                    row['MLP (years)'] = 185.4 * Math.pow(brainWeight, 0.636) * Math.pow(bw, -0.225);
                }

                // 3. 获取其他需要的值
                const cl = parseFloat(row['Cl(L/h)']);
                const fu = parseFloat(row['Fu']) || 1; // 默认为1如果未设置
                const mlp = parseFloat(row['MLP (years)']);

                // 4. 计算其他列

        // 添加通用的绘制拟合图函数
        function plotFittingGeneral(xColumn, yColumn, chartTitle) {
            if (!currentAllometryData || !currentAllometryData.logData) {
                console.error('No data available for plotting');
                return;
            }

            // 获取数据点
            const data = currentAllometryData.logData;
            const xValues = [];
            const yValues = [];

            // 获取I37:I40和指定Y列的数据
            for (let i = 0; i < 4; i++) {  // 4行数据
                const xValue = data[i][xColumn];  // I列 (Log BW)
                const yValue = data[i][yColumn];  // 指定的Y列
                if (xValue !== null && yValue !== null) {
                    xValues.push(xValue);
                    yValues.push(yValue);
                }
            }

            // 计算线性回归
            const n = xValues.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;
            for (let i = 0; i < n; i++) {
                sumX += xValues[i];
                sumY += yValues[i];
                sumXY += xValues[i] * yValues[i];
                sumX2 += xValues[i] * xValues[i];
                sumY2 += yValues[i] * yValues[i];
            }
            
            // 计算斜率和截距
            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;

            // 计算 R-squared
            const meanY = sumY / n;
            let totalSS = 0;
            let residualSS = 0;
            for (let i = 0; i < n; i++) {
                const predictedY = slope * xValues[i] + intercept;
                totalSS += Math.pow(yValues[i] - meanY, 2);
                residualSS += Math.pow(yValues[i] - predictedY, 2);
            }
            const rSquared = 1 - (residualSS / totalSS);
            const r = Math.sqrt(rSquared);

            // Create fitting line data points
            const minX = Math.min(...xValues);
            const maxX = Math.max(...xValues);
            const fitX = [minX, maxX];
            const fitY = fitX.map(x => slope * x + intercept);

            // 销毁现有图表
            if (currentChart) {
                currentChart.destroy();
            }

            // 创建新图表
            const ctx = document.getElementById('myChart').getContext('2d');
            currentChart = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [
                        {
                            label: '数据点',
                            data: xValues.map((x, i) => ({x: x, y: yValues[i]})),
                            backgroundColor: 'rgb(0, 0, 255)',
                            pointStyle: 'circle',
                            pointRadius: 6,
                            showLine: false
                        },
                        {
                            label: '拟合曲线',
                            data: fitX.map((x, i) => ({x: x, y: fitY[i]})),
                            backgroundColor: 'rgb(255, 0, 0)',
                            borderColor: 'rgb(255, 0, 0)',
                            pointStyle: 'line',
                            pointRadius: 0,
                            showLine: true,
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: chartTitle,
                            font: { size: 16 },
                            padding: { top: 10, bottom: 30 }
                        },
                        subtitle: {
                            display: true,
                            text: `y = ${slope.toFixed(8)}x + ${intercept.toFixed(8)}    R = ${r.toFixed(8)}    R² = ${rSquared.toFixed(8)}`,
                            font: { size: 14 },
                            padding: { bottom: 10 }
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Log BW'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: yColumn
                            }
                        }
                    }
                }
            });

            // 滚动到图表位置
            document.getElementById('chartContainer').scrollIntoView({ behavior: 'smooth' });
        }

                // 获取前四个动物的数据（Mouse, Rat, Dog, Monkey）
                const animals = currentAllometryData.mainData.slice(0, 4);

                animals.forEach((animal, index) => {
                    const bw = animal['Body Weight (kg)'];
                    const cl = animal['Cl(L/h)'];
                    const mlp = animal['MLP (years)'];
                    const brw = animal['Brain Weight (kg)'];
                    const fu = animal['Fu'];

                    if (bw > 0) {
                        currentAllometryData.logData[index]['Log BW'] = Math.log10(bw);
                        
                        if (cl > 0) {
                            // 计算各种对数值
                            currentAllometryData.logData[index]['if 0.55＜b ≤0.71 log CL'] = Math.log10(cl);
                            
                            if (mlp > 0) {
                                currentAllometryData.logData[index]['if 0.71＜b ≤1 log CL*MLP'] = Math.log10(cl * mlp);
                                currentAllometryData.logData[index]['if 0.71＜b ≤1 log CL/Fu*MLP'] = Math.log10((cl / fu) * mlp);
                            }
                            
                            if (brw > 0) {
                                currentAllometryData.logData[index]['if 1＜b ≤1.3 log CL*BrW'] = Math.log10(cl * brw);
                                currentAllometryData.logData[index]['if 1＜b ≤1.3 log CL/Fu*BrW'] = Math.log10((cl / fu) * brw);
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('更新对数数据时发生错误:', error);
            }
        }

        // 添加 restoreIVIVEData 函数
        function restoreIVIVEData() {
            if (!currentIVIVEData) return;
            
            try {
                // 遍历所有行和可编辑列
                for (let i = 2; i < currentIVIVEData.length; i++) {
                    // 跳过input data和output data行
                    if (i === 23 || i === 24) continue;
                    
                    // 可编辑列的索引 (B=1, D=3, E=4, H=7, I=8, L=11)
                    const editableColumns = [1, 3, 4, 7, 8, 11];
                    
                    for (let j of editableColumns) {
                        const storageKey = `ivive_${i}_${j}`;
                        const savedValue = sessionStorage.getItem(storageKey);
                        
                        if (savedValue !== null) {
                            // 确保数组和行存在
                            if (!currentIVIVEData[i]) {
                                currentIVIVEData[i] = [];
                            }
                            
                            // 更新数据
                            currentIVIVEData[i][j] = parseFloat(savedValue);
                        }
                    }
                }
                
                console.log('IVIVE数据恢复完成:', currentIVIVEData);
            } catch (error) {
                console.error('恢复IVIVE数据时发生错误:', error);
            }
        }

        // 添加 updateIVIVEValue 函数（如果还没有定义）
        function updateIVIVEValue(newValue, rowIndex, colIndex) {
            try {
                const numValue = parseFloat(newValue);
                if (isNaN(numValue)) return;

                // 保存到 SessionStorage
                const storageKey = `ivive_${rowIndex}_${colIndex}`;
                sessionStorage.setItem(storageKey, numValue.toString());
                console.log(`保存 IVIVE 值 ${numValue} 到 ${storageKey}`);

                // 更新当前数据
                if (!currentIVIVEData[rowIndex]) {
                    currentIVIVEData[rowIndex] = [];
                }
                currentIVIVEData[rowIndex][colIndex] = numValue;

                // 更新显示
                displayIVIVEData(currentIVIVEData, 'IVIVE for CL.csv');
            } catch (error) {
                console.error('更新IVIVE数据时发生错误:', error);
            }
        }

        // 修改 updateAllometryCalculations 函数，添加所有列的计算
        function updateAllometryCalculations(row) {
            try {
                // 获取基础输入值
                const bodyWeight = parseFloat(row['Body Weight (kg)']);
                const cl = parseFloat(row['Cl(L/h)']);
                const fu = parseFloat(row['Fu']) || 1; // 如果Fu未设置，默认为1

                // 1. 计算 Brain Weight (C列)
                if (!isNaN(bodyWeight)) {
                    switch(row['Animal']) {
                        case 'Mouse':
                            row['Brain Weight (kg)'] = bodyWeight * 1.65/100;
                            break;
                        case 'Rat':
                            row['Brain Weight (kg)'] = bodyWeight * 0.57/100;
                            break;
                        case 'Dog':
                            row['Brain Weight (kg)'] = bodyWeight * 0.78/100;
                            break;
                        case 'Monkey':
                            row['Brain Weight (kg)'] = bodyWeight * 1.56/100;
                            break;
                        case 'Human':
                            row['Brain Weight (kg)'] = bodyWeight * 2/100;
                            break;
                    }
                }

                // 2. 计算 MLP (D列)
                const brainWeight = parseFloat(row['Brain Weight (kg)']);
                if (!isNaN(bodyWeight) && !isNaN(brainWeight) && bodyWeight > 0 && brainWeight > 0) {
                    row['MLP (years)'] = 185.4 * Math.pow(brainWeight, 0.636) * Math.pow(bodyWeight, -0.225);
                }

                // 3. 计算 CL*MLP (G列)
                if (!isNaN(cl) && !isNaN(row['MLP (years)'])) {
                    row['CL*MLP'] = cl * row['MLP (years)'];
                }

                // 4. 计算 CL*BrW (H列)
                if (!isNaN(cl) && !isNaN(brainWeight)) {
                    row['CL*BrW'] = cl * brainWeight;
                }

                // 5. 计算 CL/Fu (I列)
                if (!isNaN(cl) && !isNaN(fu) && fu !== 0) {
                    row['CL/Fu'] = cl / fu;
                }

                // 6. 计算 CL/Fu*MLP (J列)
                if (!isNaN(cl) && !isNaN(fu) && fu !== 0 && !isNaN(row['MLP (years)'])) {
                    row['CL/Fu*MLP'] = (cl / fu) * row['MLP (years)'];
                }

                // 7. 计算 CL/Fu*BrW (K列)
                if (!isNaN(cl) && !isNaN(fu) && fu !== 0 && !isNaN(brainWeight)) {
                    row['CL/Fu*BrW'] = (cl / fu) * brainWeight;
                }

                // 确保所有计算值都保留8位小数
                const calculatedColumns = [
                    'Brain Weight (kg)', 
                    'MLP (years)', 
                    'CL*MLP', 
                    'CL*BrW', 
                    'CL/Fu', 
                    'CL/Fu*MLP', 
                    'CL/Fu*BrW'
                ];
                
                calculatedColumns.forEach(column => {
                    if (typeof row[column] === 'number') {
                        row[column] = parseFloat(row[column].toFixed(8));
                    }
                });

                console.log('计算完成:', row); // 调试日志

            } catch (error) {
                console.error('计算 Allometry 值时发生错误:', error);
            }
        }
    </script>
